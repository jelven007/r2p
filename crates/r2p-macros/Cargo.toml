[package]
name = "r2p-macros"
version = "0.30.0"
description = "Proc macros for r2p package"
authors.workspace = true
keywords.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
proc-macro = true

[features]
multiple-pymethods = []
experimental-async = ["r2p-macros-backend/experimental-async"]
experimental-inspect = ["r2p-macros-backend/experimental-inspect"]

[dependencies]
proc-macro2 = { version = "1.0.60", default-features = false }
quote = "1"
syn = { version = "3", features = ["full", "extra-traits"] }
r2p-macros-backend = { path = "../r2p-macros-backend", version = "=0.30.0" }

[lints]
workspace = true
