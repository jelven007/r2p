[package]
name = "r2p-ffi"
version = "0.30.0"
description = "Python-API bindings for the r2p ecosystem"
links = "r2p-ffi-python"
authors.workspace = true
keywords.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
libc = "0.2.62"

[features]

default = []

# Use the Python limited API. See https://www.python.org/dev/peps/pep-0384/ for more.
abi3 = []

# Use the Free-threaded Python limited API. See https://www.python.org/dev/peps/pep-0803/ for more.
abi3t = []

# With abi3, we can manually set the minimum Python version.
abi3-py39 = ["abi3-py310"]
abi3-py310 = ["abi3-py311"]
abi3-py311 = ["abi3-py312"]
abi3-py312 = ["abi3-py313"]
abi3-py313 = ["abi3-py314"]
abi3-py314 = ["abi3-py315"]
abi3-py315 = ["abi3"]

abi3t-py315 = ["abi3t"]

# deprecated
extension-module = ["r2p-build-config/extension-module"]
generate-import-lib = ["r2p-build-config/generate-import-lib"]

[dev-dependencies]
paste = "1"

[build-dependencies]
r2p-build-config = { path = "../r2p-build-config", version = "=0.30.0" }

[lints]
workspace = true

[package.metadata.cpython]
min-version = "3.9"
max-version = "3.15" # inclusive

[package.metadata.pypy]
min-version = "3.11"
max-version = "3.12" # inclusive

[package.metadata.graalpy]
min-version = "3.12"
max-version = "3.13" # inclusive
