[package]
name = "maturin-starter"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
name = "maturin_starter"
crate-type = ["cdylib"]

[dependencies]
r2p-maturin-bridge = { package = "pyo3-ffi", path = "../../tools/maturin-bridge" }
r2p = { path = "../../" }

[features]
abi3 = ["r2p/abi3-py39", "r2p-maturin-bridge/abi3-py39"]

[workspace]
