[package]
name = "meson-starter"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
name = "meson_starter"
crate-type = ["cdylib"]

[dependencies]
# The build backend supplies the checkout's crates and lockfile.
# _build_backend.py stages this SDK version into Meson's local subprojects.
r2p = "*"

[features]
abi3 = ["r2p/abi3-py39"]
hashbrown = ["r2p/hashbrown"]
parking_lot = ["r2p/parking_lot"]

[workspace]
