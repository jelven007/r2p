[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "r2p-runtime"
dynamic = ["version"]
description = "Reserved r2p runtime package; no standalone runtime functionality"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
keywords = []
authors = [
  { name = "David Hewitt", email = "1939362+davidhewitt@users.noreply.github.com" },
]
classifiers = [
  "Private :: Do Not Upload",
  "Development Status :: 1 - Planning",
  "Programming Language :: Python",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jelven007/r2p"

[tool.hatch.version]
path = "src/r2p_runtime/__init__.py"
