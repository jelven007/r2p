[package]
name = "r2p-benches"
version = "0.1.0"
description = "In-tree benchmarks for the r2p project"
authors = ["PyO3 Project and Contributors <https://github.com/PyO3>"]
edition = "2024"
publish = false

[dependencies]
r2p = { path = "../..", features = ["auto-initialize", "full"] }

[build-dependencies]
r2p-build-config = { path = "../../crates/r2p-build-config" }

[dev-dependencies]
codspeed-criterion-compat = "5.0"
criterion = "0.8.0"
num-bigint = "0.4.3"
rust_decimal = { version = "1.0.0", default-features = false }
hashbrown = "0.17"

[features]
abi3 = ["r2p/abi3"]

[[bench]]
name = "bench_any"
harness = false

[[bench]]
name = "bench_attach"
harness = false

[[bench]]
name = "bench_attach_scaling"
harness = false

[[bench]]
name = "bench_call"
harness = false

[[bench]]
name = "bench_comparisons"
harness = false

[[bench]]
name = "bench_critical_sections"
harness = false

[[bench]]
name = "bench_err"
harness = false

[[bench]]
name = "bench_decimal"
harness = false

[[bench]]
name = "bench_dict"
harness = false

[[bench]]
name = "bench_frompyobject"
harness = false

[[bench]]
name = "bench_intopyobject"
harness = false

[[bench]]
name = "bench_list"
harness = false

[[bench]]
name = "bench_py"
harness = false

[[bench]]
name = "bench_pyclass"
harness = false

[[bench]]
name = "bench_set"
harness = false

[[bench]]
name = "bench_tuple"
harness = false

[[bench]]
name = "bench_intern"
harness = false

[[bench]]
name = "bench_extract"
harness = false

[[bench]]
name = "bench_bigint"
harness = false

[[bench]]
name = "bench_pystring_from_fmt"
harness = false

[[bench]]
name = "bench_int128"
harness = false

[workspace]
