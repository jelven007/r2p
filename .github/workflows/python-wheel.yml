name: Build and release wheels

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful full CI run for the exact selected source
        required: true
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  admission:
    runs-on: ubuntu-latest
    env:
      SDK_SOURCE_SHA: ${{ github.sha }}
      CANDIDATE_CI_RUN_ID: ${{ inputs.ci_run_id || vars.R2P_CANDIDATE_CI_RUN_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Require complete successful CI for this source
        run: |
          SDK_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          python -m tools.release_gate --sha "$SDK_SOURCE_SHA" --version "$SDK_VERSION" --run-id "$CANDIDATE_CI_RUN_ID" --output target/wheel-gate.json
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-check
          path: target/accepted-candidate
          run-id: ${{ inputs.ci_run_id || vars.R2P_CANDIDATE_CI_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Require the verified candidate and retained restoration
        run: python -m tools.candidate_artifacts verify --manifest target/accepted-candidate/manifest.json --sha "$SDK_SOURCE_SHA" --output target/verified-candidate.json

  native_wheels:
    needs: [admission]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64
            python-architecture: x64
            platform-id: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64
            python-architecture: arm64
            platform-id: linux-aarch64
          - runner: windows-latest
            target: x64
            python-architecture: x64
            platform-id: windows-x64
          - runner: windows-latest
            target: x86
            python-architecture: x86
            platform-id: windows-x86
          - runner: windows-11-arm
            target: aarch64
            python-architecture: arm64
            platform-id: windows-aarch64
          - runner: macos-15-intel
            target: x86_64
            python-architecture: x64
            platform-id: macos-x86_64
          - runner: macos-latest
            target: aarch64
            python-architecture: arm64
            platform-id: macos-aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          architecture: ${{ matrix.python-architecture }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --compatibility pypi
          manylinux: auto
          working-directory: crates/r2p-introspection
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Check distribution metadata
        shell: bash
        run: uvx twine check crates/r2p-introspection/dist/*.whl
      - name: Install and execute this native wheel
        shell: bash
        run: python -m tools.cli_wheel_acceptance --sha "$SDK_SOURCE_SHA" --dist crates/r2p-introspection/dist --platform-id "$WHEEL_PLATFORM"
        env:
          SDK_SOURCE_SHA: ${{ github.sha }}
          WHEEL_PLATFORM: ${{ matrix.platform-id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accepted-cli-${{ matrix.platform-id }}
          path: crates/r2p-introspection/dist
          if-no-files-found: error

  pypi_release:
    if: startsWith(github.ref, 'refs/tags/v') && vars.R2P_ENABLE_PYPI == 'true'
    needs: [admission, native_wheels]
    permissions:
      contents: read
      id-token: write
      actions: read
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: accepted-cli-*
          path: crates/r2p-introspection/dist
          merge-multiple: true
      - name: Verify the exact accepted native platform set before publishing
        run: python -m tools.cli_wheel_acceptance --sha "$SDK_SOURCE_SHA" --dist crates/r2p-introspection/dist --verify-set
        env:
          SDK_SOURCE_SHA: ${{ github.sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Generate attestations for the accepted wheel bytes
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6
        with:
          paths: crates/r2p-introspection/dist/*.whl
      - name: Publish the accepted wheels to PyPI
        run: uv publish --trusted-publishing always 'crates/r2p-introspection/dist/*.whl'
