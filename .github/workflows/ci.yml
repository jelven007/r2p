name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  UV_LOCKED: 1
  CARGO_TERM_COLOR: always
  NOX_DEFAULT_VENV_BACKEND: uv
  UV_PYTHON: 3.14

permissions:
  contents: read

jobs:
  engineering:
    needs: [resolve]
    if: ${{ fromJSON(needs.resolve.outputs.plan).jobs['engineering'].status != 'not-applicable' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Validate engineering content and CI contract
        run: |
          uv run --isolated --only-group nox nox -s ruff rumdl repository-check typos
          uv run --isolated --only-group nox python -m tools.ci_policy check
      - name: Install actionlint
        if: contains(fromJSON(needs.resolve.outputs.plan).categories, 'tooling')
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/r2p-tools"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/r2p-tools" actionlint
          echo "$RUNNER_TEMP/r2p-tools" >> "$GITHUB_PATH"
      - name: Validate workflow syntax
        if: contains(fromJSON(needs.resolve.outputs.plan).categories, 'tooling')
        run: uv run --isolated --only-group nox python tools/check_workflows.py

  zizmor:
    needs: [resolve]
    if: ${{ fromJSON(needs.resolve.outputs.plan).jobs['zizmor'].status != 'not-applicable' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}
      - name: Run zizmor
        run: uv run --isolated --only-group nox nox -s zizmor -- --format=github
        env:
          GH_TOKEN: ${{ github.token }}

  fmt:
    needs: [resolve]
    if: ${{ fromJSON(needs.resolve.outputs.plan).jobs['fmt'].status != 'not-applicable' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component rustfmt
          rustup default stable
      - name: Check formatting and lints
        run: uv run --isolated --only-group nox nox -s rustfmt check-test-features

  resolve:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.selection.outputs.plan }}
      MSRV: ${{ steps.resolve-msrv.outputs.MSRV }}
      verbose: ${{ runner.debug == '1' }}
      save-cache: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}
      # For PRs, we need to run on the real PR head, not the resultant merge of the PR into the target branch.
      #
      # This is necessary for coverage reporting to make sense; we then get exactly the coverage change
      # between the base branch and the real PR head.
      #
      # If it were run on the merge commit the problem is that the coverage potentially does not align
      # with the commit diff, because the merge may affect line numbers.
      coverage-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: resolve MSRV
        id: resolve-msrv
        run: echo MSRV=`python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["rust-version"])'` >> $GITHUB_OUTPUT
      - name: Select checks with explicit applicability
        id: selection
        run: python -m tools.ci_policy select

  semver-checks:
    if: ${{ fromJSON(needs.resolve.outputs.plan).jobs['semver-checks'].status != 'not-applicable' }}
    needs: [fmt, resolve]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Fetch merge base
        id: fetch_merge_base
        uses: $/.github/actions/fetch-merge-base
        with:
          base_ref: "refs/heads/${{ github.event.pull_request.base.ref }}"
          head_ref: "refs/pull/${{ github.event.pull_request.number }}/merge"
      - name: Determine package identity compatibility
        id: identity
        env:
          BASELINE_REV: ${{ steps.fetch_merge_base.outputs.merge_base }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import tomllib
          from pathlib import Path
          baseline = tomllib.loads(subprocess.check_output(
              ["git", "show", f"{os.environ['BASELINE_REV']}:Cargo.toml"], text=True
          ))["package"]["name"]
          current = tomllib.loads(Path("Cargo.toml").read_text())["package"]["name"]
          same = baseline == current
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"same={str(same).lower()}", file=output)
          if not same:
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  print(f"Package identity migration: {baseline} → {current}. "
                        "Automatic same-package semver comparison is inapplicable; "
                        "see the namespace migration and validation reports.", file=summary)
          PY
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        if: steps.identity.outputs.same == 'true'
        with:
          baseline-rev: ${{ steps.fetch_merge_base.outputs.merge_base }}

  check-msrv:
    needs: [fmt, resolve]
    if: ${{ fromJSON(needs.resolve.outputs.plan).jobs['check-msrv'].status != 'not-applicable' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        env:
          RUST_TOOLCHAIN: ${{ needs.resolve.outputs.MSRV }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update --component rust-src
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          save-cache: ${{ needs.resolve.outputs.save-cache }}
      # This is a smoke test to confirm that CI will run on MSRV (including dev dependencies)
      - name: Check with MSRV package versions
        run: uv run --isolated --only-group nox nox -s set-msrv-package-versions -- check-all
      - name: Preserve MSRV dependency evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msrv-dependencies
          path: |
            target/msrv/**/msrv-evidence.json
            target/msrv/**/Cargo.lock
          if-no-files-found: error

    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu

  clippy:
    needs: [fmt, resolve]
    if: ${{ fromJSON(needs.resolve.outputs.plan).jobs['clippy'].status != 'not-applicable' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # If one platform fails, allow the rest to keep testing if `CI-no-fail-fast` label is present
      fail-fast: ${{ !contains(github.event.pull_request.labels.*.name, 'CI-no-fail-fast') }}
      matrix: ${{ fromJSON(needs.resolve.outputs.plan).matrices.clippy }}
    name: ${{ matrix.name }}
    continue-on-error: ${{ matrix.allow-failure }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        env:
          RUST_TOOLCHAIN: ${{ matrix.rust }}
          RUST_TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update --component clippy,rust-src --target "$RUST_TARGET"
          rustup default "$RUST_TOOLCHAIN"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}
      - run: uv run --isolated --only-group nox nox -s clippy-all
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      UV_PYTHON: ${{ matrix.python-version }}

  check-nightly:
    needs: [fmt, resolve]
    if: ${{ fromJSON(needs.resolve.outputs.plan).jobs['check-nightly'].status != 'not-applicable' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # If one platform fails, allow the rest to keep testing if `CI-no-fail-fast` label is present
      fail-fast: ${{ !contains(github.event.pull_request.labels.*.name, 'CI-no-fail-fast') }}
      matrix: ${{ fromJSON(needs.resolve.outputs.plan).matrices.nightly }}
    name: ${{ matrix.name }}
    continue-on-error: ${{ matrix.allow-failure }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        env:
          RUST_TARGET: ${{ matrix.target }}
          RUST_TOOLCHAIN: ${{ matrix.rust }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update --component clippy,rust-src --target "$RUST_TARGET" --allow-downgrade
          rustup default "$RUST_TOOLCHAIN"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}
      - run: uv run --isolated --only-group nox nox -s check-all
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      UV_PYTHON: ${{ matrix.python-version }}

  build-pr:
    permissions:
      contents: read
    if: ${{ fromJSON(needs.resolve.outputs.plan).jobs['build-pr'].status != 'not-applicable' }}
    name: ${{ matrix.name }}
    needs: [fmt, resolve]
    uses: $/.github/workflows/build.yml
    with:
      sha: ${{ needs.resolve.outputs.coverage-sha }}
      os: ${{ matrix.platform.os }}
      python-version: ${{ matrix.python-version }}
      python-architecture: ${{ matrix.platform.python-architecture }}
      rust: ${{ matrix.rust }}
      rust-target: ${{ matrix.platform.rust-target }}
      MSRV: ${{ needs.resolve.outputs.MSRV }}
      verbose: ${{ needs.resolve.outputs.verbose == 'true' }}
      ffi-check: ${{ fromJSON(needs.resolve.outputs.plan).ffi }}
      allow-failure: ${{ matrix.allow-failure }}
      cell-id: ${{ matrix.id }}
      job-name: ${{ matrix.name }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      # If one platform fails, allow the rest to keep testing if `CI-no-fail-fast` label is present
      fail-fast: ${{ !contains(github.event.pull_request.labels.*.name, 'CI-no-fail-fast') }}
      matrix: ${{ fromJSON(needs.resolve.outputs.plan).matrices.pr }}

  build-full:
    permissions:
      contents: read
    if: ${{ fromJSON(needs.resolve.outputs.plan).jobs['build-full'].status != 'not-applicable' }}
    name: ${{ matrix.name }}
    needs: [fmt, resolve]
    uses: $/.github/workflows/build.yml
    with:
      sha: ${{ needs.resolve.outputs.coverage-sha }}
      os: ${{ matrix.platform.os }}
      python-version: ${{ matrix.python-version }}
      python-architecture: ${{ matrix.platform.python-architecture }}
      rust: ${{ matrix.rust }}
      rust-target: ${{ matrix.platform.rust-target }}
      MSRV: ${{ needs.resolve.outputs.MSRV }}
      verbose: ${{ needs.resolve.outputs.verbose == 'true' }}
      ffi-check: ${{ fromJSON(needs.resolve.outputs.plan).ffi }}
      allow-failure: ${{ matrix.allow-failure }}
      cell-id: ${{ matrix.id }}
      job-name: ${{ matrix.name }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      # If one platform fails, allow the rest to keep testing if `CI-no-fail-fast` label is present
      fail-fast: ${{ !contains(github.event.pull_request.labels.*.name, 'CI-no-fail-fast') }}
      matrix: ${{ fromJSON(needs.resolve.outputs.plan).matrices.full }}

  valgrind:
    if: ${{ fromJSON(needs.resolve.outputs.plan).jobs['valgrind'].status != 'not-applicable' }}
    needs: [fmt, resolve]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: valgrind
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}
      - run: uv run --isolated --only-group nox nox -s test-rust -- release skip-full
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: valgrind --leak-check=no --error-exitcode=1
      RUST_BACKTRACE: 1
      UI_TEST: skip

  careful:
    if: ${{ fromJSON(needs.resolve.outputs.plan).jobs['careful'].status != 'not-applicable' }}
    needs: [fmt, resolve]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}
      # TODO: unpin to nightly once the below is fixed
      # https://github.com/RalfJung/cargo-careful/issues/55
      - name: Install Rust toolchain
        run: |
          rustup toolchain install nightly-2026-08-06 --profile minimal --no-self-update --component rust-src
          rustup default nightly-2026-08-06
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-careful
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}
      - run: uv run --isolated --only-group nox nox -s test-rust -- careful skip-full
    env:
      RUST_BACKTRACE: 1
      UI_TEST: skip

  docsrs:
    if: ${{ fromJSON(needs.resolve.outputs.plan).jobs['docsrs'].status != 'not-applicable' }}
    needs: [fmt, resolve]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}
      - name: Install Rust toolchain
        run: |
          rustup toolchain install nightly --profile minimal --no-self-update --component rust-src --allow-downgrade
          rustup default nightly
      - run: cargo rustdoc --lib --no-default-features --features full,jiff-02 -Zunstable-options --config "build.rustdocflags=[\"--cfg\", \"docsrs\"]"

  emscripten:
    name: emscripten
    if: ${{ fromJSON(needs.resolve.outputs.plan).jobs['emscripten'].status != 'not-applicable' }}
    needs: [fmt, resolve]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/build-emscripten
        with:
          save-cache: ${{ needs.resolve.outputs.save-cache }}
      - name: Test
        run: uv run --isolated --only-group nox nox -s test-emscripten

  wasm32-wasip1:
    name: wasm32-wasip1
    if: ${{ fromJSON(needs.resolve.outputs.plan).jobs['wasm32-wasip1'].status != 'not-applicable' }}
    needs: [fmt, resolve]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/build-wasi
        with:
          save-cache: ${{ needs.resolve.outputs.save-cache }}
      - name: Test
        run: uv run --isolated --only-group nox nox -s test-wasm

  no_std:
    needs: [fmt, resolve]
    if: ${{ fromJSON(needs.resolve.outputs.plan).jobs['no_std'].status != 'not-applicable' }}
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.plan).matrices.no_std }}
    env:
      R2P_WIP_NO_STD: "1"
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          save-cache: ${{ needs.resolve.outputs.save-cache }}
      - name: Install Rust toolchain
        env:
          RUST_TOOLCHAIN: ${{ matrix.rust }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update --component rust-src
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}
      - name: Test
        run: uv run --isolated --only-group nox nox -s "$NOX_SESSION"
        env:
          NOX_SESSION: ${{ matrix.session }}

  test-debug:
    if: ${{ fromJSON(needs.resolve.outputs.plan).jobs['test-debug'].status != 'not-applicable' }}
    needs: [fmt, resolve]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component rust-src
          rustup default stable
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13+debug"
          save-cache: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}
      - run: uvx python -m sysconfig
      - run: uv run --isolated --only-group nox nox -s test

  test-debug-min-version:
    if: ${{ fromJSON(needs.resolve.outputs.plan).jobs['test-debug-min-version'].status != 'not-applicable' }}
    needs: [fmt, resolve]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component rust-src
          rustup default stable
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11+debug"
          save-cache: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}
      - run: uvx python -m sysconfig
      - run: uv run --isolated --only-group nox nox -s test

  test-version-limits:
    needs: [fmt, resolve]
    if: ${{ fromJSON(needs.resolve.outputs.plan).jobs['test-version-limits'].status != 'not-applicable' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.coverage-sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          save-cache: ${{ needs.resolve.outputs.save-cache }}
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ needs.resolve.outputs.save-cache }}
      - uses: $/.github/actions/prepare-coverage
      - run: uv run --isolated --only-group nox nox -s test-version-limits
      - uses: $/.github/actions/report-coverage
        with:
          name: ${{ github.job }}
          token: ${{ secrets.CODECOV_TOKEN }}

  check-feature-powerset:
    needs: [fmt, resolve]
    if: ${{ fromJSON(needs.resolve.outputs.plan).jobs['check-feature-powerset'].status != 'not-applicable' }}
    runs-on: ${{ matrix.runner }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
      UV_PYTHON: ${{ matrix.python-version }}
    name: ${{ matrix.name }}
    strategy:
      # run on stable and MSRV to check that all combinations of features are expected to build fine on our supported
      # range of compilers
      matrix: ${{ fromJSON(needs.resolve.outputs.plan).matrices.powerset }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
          rustc --version --verbose
          cargo --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-hack,cargo-minimal-versions
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          save-cache: ${{ needs.resolve.outputs.save-cache }}
      - run: uv run --isolated --only-group nox nox -s check-feature-powerset -- ${{ matrix.rust != 'stable' && 'minimal-versions' || '' }}

  test-cross-compilation:
    needs: [fmt, resolve]
    if: ${{ fromJSON(needs.resolve.outputs.plan).jobs['test-cross-compilation'].status != 'not-applicable' }}
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.name }}
    strategy:
      # If one platform fails, allow the rest to keep testing if `CI-no-fail-fast` label is present
      fail-fast: ${{ !contains(github.event.pull_request.labels.*.name, 'CI-no-fail-fast') }}
      matrix: ${{ fromJSON(needs.resolve.outputs.plan).matrices.cross }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.coverage-sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          save-cache: ${{ needs.resolve.outputs.save-cache }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.UV_PYTHON }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: examples/maturin-starter
          save-if: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}
          key: ${{ matrix.target }}
      - name: Install Rust toolchain
        shell: bash
        env:
          RUST_TOOLCHAIN: ${{ matrix.rust }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
      - name: Setup cross-compiler packages
        if: ${{ matrix.apt-packages }}
        shell: bash
        run: |
          read -r -a packages <<< "$APT_PACKAGES"
          sudo apt-get install -y -- "${packages[@]}"
        env:
          APT_PACKAGES: ${{ matrix.apt-packages }}
      - uses: $/.github/actions/prepare-coverage
        with:
          host_only: true
      - name: Compile version-specific library
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --profile=dev -m examples/maturin-starter/Cargo.toml ${{ matrix.flags }}
          manylinux: ${{ matrix.manylinux }}
          docker-options: >-
            -e LLVM_PROFILE_FILE
            -e __CARGO_LLVM_COV_RUSTC_WRAPPER
            -e __CARGO_LLVM_COV_RUSTC_WRAPPER_RUSTFLAGS
            -e __CARGO_LLVM_COV_RUSTC_WRAPPER_CRATE_NAMES
            -v /home/runner/.cargo/bin/cargo-llvm-cov:/home/runner/.cargo/bin/cargo-llvm-cov
      - name: Compile abi3 library
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --profile=dev -m examples/maturin-starter/Cargo.toml --features abi3 ${{ matrix.flags }}
          manylinux: ${{ matrix.manylinux }}
          docker-options: >-
            -e LLVM_PROFILE_FILE
            -e __CARGO_LLVM_COV_RUSTC_WRAPPER
            -e __CARGO_LLVM_COV_RUSTC_WRAPPER_RUSTFLAGS
            -e __CARGO_LLVM_COV_RUSTC_WRAPPER_CRATE_NAMES
            -v /home/runner/.cargo/bin/cargo-llvm-cov:/home/runner/.cargo/bin/cargo-llvm-cov
      - uses: $/.github/actions/report-coverage
        with:
          name: ${{ github.job }}/${{ matrix.os }}/${{ matrix.target }}
          token: ${{ secrets.CODECOV_TOKEN }}

  test-cross-compilation-windows:
    needs: [fmt, resolve]
    if: ${{ fromJSON(needs.resolve.outputs.plan).jobs['test-cross-compilation-windows'].status != 'not-applicable' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.coverage-sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          save-cache: ${{ needs.resolve.outputs.save-cache }}
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component rust-src --target x86_64-pc-windows-gnu,x86_64-pc-windows-msvc
          rustup default stable
      # load cache (prepared in ci-cache-warmup.yml)
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-cache
      - name: Setup cross-compiler
        run: sudo apt-get install -y mingw-w64 llvm
      - uses: $/.github/actions/prepare-coverage
        with:
          host_only: true
      - name: Test cross compile to Windows
        run: uv run --isolated --only-group nox nox -s test-cross-compilation-windows
      - uses: $/.github/actions/report-coverage
        with:
          name: ${{ github.job }}
          token: ${{ secrets.CODECOV_TOKEN }}

  test-introspection:
    needs: [fmt, resolve]
    if: ${{ fromJSON(needs.resolve.outputs.plan).jobs['test-introspection'].status != 'not-applicable' }}
    strategy:
      matrix: ${{ fromJSON(needs.resolve.outputs.plan).matrices.introspection }}
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.platform.rust-target }}
          RUST_TOOLCHAIN: ${{ matrix.rust }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update --target "$RUST_TARGET"
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.platform.python-architecture }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}
      - run: uv run --isolated --only-group nox nox -s test-introspection
    env:
      CARGO_BUILD_TARGET: ${{ matrix.platform.rust-target }}
      UV_PYTHON: ${{ matrix.python-version }}

  test-introspection-pr:
    needs: [fmt, resolve]
    if: ${{ fromJSON(needs.resolve.outputs.plan).jobs['test-introspection-pr'].status != 'not-applicable' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}
      - run: uv run --isolated --only-group nox nox -s test-introspection

  pytests-type-checking:
    needs: [fmt, resolve]
    if: ${{ fromJSON(needs.resolve.outputs.plan).jobs['pytests-type-checking'].status != 'not-applicable' }}
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.name }}
    strategy:
      # If one platform fails, allow the rest to keep testing if `CI-no-fail-fast` label is present
      fail-fast: ${{ !contains(github.event.pull_request.labels.*.name, 'CI-no-fail-fast') }}
      matrix: ${{ fromJSON(needs.resolve.outputs.plan).matrices.typing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        env:
          RUST_TOOLCHAIN: ${{ matrix.rust }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update --component rust-src
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}
      - run: uv run --project ../.. --isolated --only-group nox nox -s "$NOX_CHECKER"
        working-directory: tests/python
        env:
          NOX_CHECKER: ${{ matrix.checker }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}

  sdk-docs:
    needs: [fmt, resolve]
    if: ${{ fromJSON(needs.resolve.outputs.plan).jobs['sdk-docs'].status != 'not-applicable' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: mdbook@0.5, mdbook-tabs@0.3
      - name: Compile documentation examples and guide
        run: |
          cargo +stable test --doc --features full
          uv run --isolated --only-group nox nox -s docs build-guide
        env:
          RUSTDOCFLAGS: "-D warnings"

  consumer-smoke:
    needs: [fmt, resolve]
    if: ${{ fromJSON(needs.resolve.outputs.plan).jobs['consumer-smoke'].status != 'not-applicable' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Test generated consumers from the reviewed SDK revision
        run: python -m tools.consumer_smoke --revision "$SDK_REVISION" --output target/consumer-check
        env:
          SDK_REVISION: ${{ needs.resolve.outputs.coverage-sha }}
          LD_LIBRARY_PATH: ${{ env.pythonLocation }}/lib
      - name: Preserve consumer evidence and artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consumer-check
          path: target/consumer-check
          if-no-files-found: error

  candidate-acceptance:
    needs: [fmt, resolve]
    if: ${{ fromJSON(needs.resolve.outputs.plan).jobs['candidate-acceptance'].status != 'not-applicable' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.coverage-sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Accept registry packages, extension wheels, CLI and retained restoration
        run: python -m tools.candidate --sha "$SDK_REVISION" --output target/candidate-check
        env:
          SDK_REVISION: ${{ needs.resolve.outputs.coverage-sha }}
          LD_LIBRARY_PATH: ${{ env.pythonLocation }}/lib
      - name: Preserve immutable candidate evidence and artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-check
          path: |
            target/candidate-check/manifest.json
            target/candidate-check/*.log
            target/candidate-check/candidate
            target/candidate-check/baseline
          if-no-files-found: error

  conclusion:
    needs:
      - resolve
      - zizmor
      - fmt
      - semver-checks
      - check-msrv
      - clippy
      - check-nightly
      - build-pr
      - build-full
      - valgrind
      - careful
      - docsrs
      - emscripten
      - wasm32-wasip1
      - no_std
      - test-debug
      - test-debug-min-version
      - test-version-limits
      - check-feature-powerset
      - test-cross-compilation
      - test-cross-compilation-windows
      - test-introspection
      - test-introspection-pr
      - pytests-type-checking
      - engineering
      - sdk-docs
      - consumer-smoke
      - candidate-acceptance
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enforce required results and justified skips
        run: python3 -m tools.ci_policy conclude
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
