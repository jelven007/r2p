name: Release Rust Crate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Exact SDK version or v-prefixed tag at the selected source
        required: true
      ci_run_id:
        description: Successful full CI run for the exact selected commit
        required: true

jobs:
  release:
    if: vars.R2P_ENABLE_CRATES_IO == 'true'
    permissions:
      contents: read
      actions: read
      id-token: write

    runs-on: ubuntu-latest
    environment: release
    env:
      SDK_SOURCE_SHA: ${{ github.sha }}
      SDK_VERSION: ${{ inputs.version || github.ref_name }}
      CANDIDATE_CI_RUN_ID: ${{ inputs.ci_run_id || vars.R2P_CANDIDATE_CI_RUN_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag to build or the tag received by the tag event
          ref: ${{ github.event.inputs.version || github.ref }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Require the exact source and complete successful compatibility matrix
        run: python -m tools.release_gate --sha "$SDK_SOURCE_SHA" --version "$SDK_VERSION" --run-id "$CANDIDATE_CI_RUN_ID" --output target/release-gate.json
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-check
          path: target/accepted-candidate
          run-id: ${{ inputs.ci_run_id || vars.R2P_CANDIDATE_CI_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Verify retained candidate hashes, package scope and restoration
        run: python -m tools.candidate_artifacts verify --manifest target/accepted-candidate/manifest.json --sha "$SDK_SOURCE_SHA" --output target/verified-candidate.json

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Publish to crates.io
        run: python -m tools.publish_candidate --manifest target/accepted-candidate/manifest.json --gate target/release-gate.json --sha "$SDK_SOURCE_SHA" --execute
        env:
          R2P_ENABLE_CRATES_IO: ${{ vars.R2P_ENABLE_CRATES_IO }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
